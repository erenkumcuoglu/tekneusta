{% extends 'base.html' %}
{% block body %}
<header class="sub-hero" style="--sub-bg:url('/assets/images/parallax-1.jpg')">
  <div class="crumb"><a href="{{ page.home }}">{{ t.nav.home }}</a> <span>/</span> <span>{{ gtitle }}</span></div>
  <div class="sub-hero-inner"><h1>{{ gtitle }}</h1><p>{{ gintro }}</p></div>
</header>
<section class="detail-section">
  <div class="s-inner">
    <dl class="glossary">
      {% for term in glossary %}
      <div class="gloss-item reveal">
        <dt>{{ term.t }}</dt>
        <dd>{{ term.d }} <a href="{{ term.u }}" aria-label="{{ term.t }} detay">→</a></dd>
      </div>
      {% endfor %}
    </dl>
  </div>
</section>
{% include 'partials/quote_form.html' %}
{% endblock %}
