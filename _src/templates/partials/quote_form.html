<section id="teklif-al" class="form-section">
  <div class="s-inner">
    <div class="form-layout">
      <div class="form-pitch reveal">
        <div class="s-label">{{ t.form.label }}</div>
        <h2 class="s-title">{{ t.form.title }}</h2>
        <p>{{ t.form.pitch }}</p>
        <ul class="promises">
          {% for p in t.form.promises %}<li class="promise"><span class="pcheck">✓</span>{{ p }}</li>{% endfor %}
        </ul>
      </div>
      <div class="form-card reveal reveal-d1">
        <div id="f-success" class="f-success">
          <div class="f-icon">✅</div>
          <h3>{{ t.form.success_title }}</h3>
          <p>{{ t.form.success_text }}</p>
        </div>
        <form id="f-fields" name="teklif" method="POST" data-netlify="true" data-netlify-honeypot="bot-field"
              data-wa="{{ site.wa }}" data-lead="{{ t.form.lead }}">
          <input type="hidden" name="form-name" value="teklif" />
          <p hidden><label>Bot: <input name="bot-field" /></label></p>
          <div class="f-grid">
            <div class="f-row"><label for="ad">{{ t.form.name }} *</label><input id="ad" name="ad" type="text" required /></div>
            <div class="f-row"><label for="tel">{{ t.form.phone }} *</label><input id="tel" name="tel" type="tel" required /></div>
          </div>
          <div class="f-grid">
            <div class="f-row"><label for="tip">{{ t.form.boat }} *</label>
              <select id="tip" name="tip" required>
                <option value="">{{ t.form.select }}</option>
                {% for o in t.form.boat_types %}<option value="{{ o }}">{{ o }}</option>{% endfor %}
              </select>
            </div>
            <div class="f-row"><label for="hizmet">{{ t.form.service }} *</label>
              <select id="hizmet" name="hizmet" required>
                <option value="">{{ t.form.select }}</option>
                {% for s in services %}<option value="{{ s.name }}">{{ s.name }}</option>{% endfor %}
                <option value="{{ t.form.other }}">{{ t.form.other }}</option>
              </select>
            </div>
          </div>
          <div class="f-row"><label for="email">{{ t.form.email }}</label><input id="email" name="email" type="email" placeholder="{{ t.form.email_ph }}" /></div>
          <div class="f-row"><label for="not">{{ t.form.note }}</label><textarea id="not" name="not" placeholder="{{ t.form.note_ph }}"></textarea></div>
          <label class="f-consent"><input type="checkbox" id="izin" name="izin" value="evet" /><span>{{ t.form.consent }}</span></label>
          <button type="submit" class="f-submit"><svg class="wa-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413z"/><path d="M12 0C5.373 0 0 5.373 0 12c0 2.117.554 4.103 1.523 5.828L.057 23.428a.5.5 0 0 0 .609.61l5.733-1.498A11.943 11.943 0 0 0 12 24c6.627 0 12-5.373 12-12S18.627 0 12 0z"/></svg>{{ t.form.submit }}</button>
          <p class="f-note">{{ t.form.privacy }}</p>
        </form>
      </div>
    </div>
  </div>
</section>
