{% extends 'base.html' %}
{% block body %}
<header class="sub-hero" style="--sub-bg:url('/assets/images/parallax-3.jpg')">
  <div class="crumb"><a href="{{ page.home }}">{{ t.nav.home }}</a> <span>/</span> <span>{{ t.nav.blog }}</span></div>
  <div class="sub-hero-inner"><h1>{{ t.blog.title }}</h1><p>{{ t.blog.sub }}</p></div>
</header>
<section class="detail-section">
  <div class="s-inner">
    <div class="blog-grid">
      {% for post in posts %}
      <a class="blog-card reveal reveal-d{{ (loop.index0 % 3) + 1 }}" href="{{ post.url }}">
        <div class="thumb" style="--thumb:url('{{ post.image }}')"></div>
        <div class="bc-body">
          <span class="bc-cat">{{ post.category }}</span>
          <h3>{{ post.title }}</h3>
          <p>{{ post.excerpt }}</p>
        </div>
      </a>
      {% endfor %}
    </div>
  </div>
</section>
{% include 'partials/quote_form.html' %}
{% endblock %}
